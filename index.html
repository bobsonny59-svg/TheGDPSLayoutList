<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1024" />
        <title>the larp list</title>

        <link rel="icon" href="/list_icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" type="text/css" href="/css/reset.css" />
        <link rel="stylesheet" type="text/css" href="/css/typography.css" />
        <link rel="stylesheet" type="text/css" href="/css/main.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/list.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/leaderboard.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/btn.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/tabs.css" />
        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script type="module" src="/js/main.js"></script>
    </head>
    <body id="app">
        <!-- FLEX: Keeps everything in one line, allows horizontal scrolling on mobile -->
        <header :class="{ dark: store.dark }" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; flex-wrap: nowrap; overflow-x: auto; gap: 15px;">
            
            <!-- LOGO: Forced to 1 line -->
            <div class="logo" style="display: flex; align-items: center; gap: 8px; white-space: nowrap; flex-shrink: 0;">
                <h2 style="margin: 0; font-size: 22px; font-weight: 700;">Larp List</h2>
                <p style="margin: 0; font-size: 11px; opacity: 0.8;">v1.0.0</p>
            </div>
            
            <nav class="nav" style="display: flex; align-items: center; gap: 15px; flex-shrink: 0;">
                
                <!-- NAV TABS -->
                <router-link class="nav__tab" to="/">
                    <span class="type-label-lg">List</span>
                </router-link>
                <router-link class="nav__tab" to="/leaderboard">
                    <span class="type-label-lg">Leaderboard</span>
                </router-link>
                <router-link class="nav__tab" to="/roulette">
                    <span class="type-label-lg">Roulette</span>
                </router-link>
                
                <!-- BUTTONS & ICONS: Spacing tight, gaps removed -->
                <div class="nav__actions" style="display: flex; align-items: center; gap: 0; flex-shrink: 0; margin-left: 0;">
                    
                    <!-- MOON ICON -->
                    <button class="nav__icon" @click.prevent="store.toggleDark()" style="background: transparent; border: none; cursor: pointer; padding: 4px 8px; display: flex; align-items: center;">
                        <img :src="store.dark ? '/assets/light.svg' : '/assets/dark.svg'" alt="" style="width: 20px; height: 20px; display: block;" />
                    </button>

                    <!-- DISCORD ICON -->
                    <a class="nav__icon" href="https://discord.gg/W9PhXXMSd" style="display: flex; align-items: center; padding: 4px 8px;">
                        <img src="/assets/discord.svg" alt="Discord Logo" style="width: 20px; height: 20px; display: block;" />
                    </a>

                    <!-- SUBMIT RECORD (Smaller padding to match the screenshot exactly) -->
                    <a class="type-label-lg" href="https://forms.gle/irLaSCGuXMbEwD28A" target="_blank" style="display: inline-flex; align-items: center; padding: 5px 12px; background: white; color: #2b6ef0; border-radius: 6px; text-decoration: none; font-weight: 700; font-size: 13px; margin-left: 2px; white-space: nowrap;">Submit Record</a>

                    <!-- LOGIN / REGISTER / PROFILE / LOGOUT -->
                    <template v-if="!store.user">
                        <router-link to="/login" style="display: inline-flex; align-items: center; padding: 5px 12px; background: white; color: #2b6ef0; border-radius: 6px; text-decoration: none; font-weight: 700; font-size: 13px; margin-left: 4px; white-space: nowrap;">Login</router-link>
                        <router-link to="/register" style="display: inline-flex; align-items: center; padding: 5px 12px; background: white; color: #2b6ef0; border-radius: 6px; text-decoration: none; font-weight: 700; font-size: 13px; margin-left: 4px; white-space: nowrap;">Register</router-link>
                    </template>
                    <template v-else>
                        <router-link to="/profile" style="display: inline-flex; align-items: center; padding: 5px 12px; background: white; color: #2b6ef0; border-radius: 6px; text-decoration: none; font-weight: 700; font-size: 13px; margin-left: 4px; white-space: nowrap;">Profile</router-link>
                        <a @click.prevent="store.logout()" href="#" style="display: inline-flex; align-items: center; padding: 5px 12px; background: white; color: #2b6ef0; border-radius: 6px; text-decoration: none; font-weight: 700; font-size: 13px; margin-left: 4px; white-space: nowrap; cursor: pointer;">Logout</a>
                    </template>
                    
                </div>
            </nav>
        </header>
        <router-view :class="{ dark: store.dark }"></router-view>
    </body>
</html>
