<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1024" />
        <title>the larp list</title>

        <!-- Replace your server icon by uploading an image file named "list_icon.png"-->
        <link rel="icon" href="/list_icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" type="text/css" href="/css/reset.css" />
        <link rel="stylesheet" type="text/css" href="/css/typography.css" />
        <link rel="stylesheet" type="text/css" href="/css/main.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/list.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="/css/pages/leaderboard.css"
        />
        <link rel="stylesheet" type="text/css" href="/css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/btn.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="/css/components/tabs.css"
        />
        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        
        <!-- REMOVED: <script type="module" src="/js/main.js"></script> to prevent white screen conflicts -->
    </head>
    <body id="app">
        <header :class="{ dark: store.dark }">
            <div class="logo">
                <h2>Larp List</h2>
                <p>v1.0.0</p>
            </div>
            <nav class="nav">
                <router-link class="nav__tab" to="/">
                    <span class="type-label-lg">List</span>
                </router-link>
                <router-link class="nav__tab" to="/leaderboard">
                    <span class="type-label-lg">Leaderboard</span>
                </router-link>
                <router-link class="nav__tab" to="/roulette">
                    <span class="type-label-lg">Roulette</span>
                </router-link>
                <div class="nav__actions">
                    <!-- Login and Register buttons -->
                    <router-link class="nav__cta type-label-lg" to="/login">
                        Login
                    </router-link>
                    <router-link class="nav__cta type-label-lg" to="/register">
                        Register
                    </router-link>
                    
                    <button
                        class="nav__icon"
                        @click.prevent="store.toggleDark()"
                    >
                        <img
                            :src="store.dark ? '/assets/light.svg' : '/assets/dark.svg'"
                            alt=""
                        />
                    </button>
                    <a class="nav__icon" href="https://discord.gg/W9PhXXMSd">
                        <img src="/assets/discord.svg" alt="Discord Logo" />
                    </a>
                    <a
                        class="nav__cta type-label-lg"
                        href="https://forms.gle/irLaSCGuXMbEwD28A"
                        target="_blank"
                        >Submit Record</a
                    >
                </div>
            </nav>
        </header>
        <router-view :class="{ dark: store.dark }"></router-view>

        <!-- ===================================================== -->
        <!-- SELF-CONTAINED VUE APP WITH LOGIN/REGISTER PAGES ADDED -->
        <!-- ===================================================== -->
        <script>
            const { createApp, reactive } = Vue;
            const { createRouter, createWebHistory } = VueRouter;

            // 1. Your Store
            const store = reactive({
                dark: false,
                toggleDark() { this.dark = !this.dark; }
            });

            // 2. Placeholder pages for your existing routes
            const Home = { template: `<div style="padding: 40px; text-align: center; font-size: 24px;">List Page</div>` };
            const Leaderboard = { template: `<div style="padding: 40px; text-align: center;">Leaderboard Page</div>` };
            const Roulette = { template: `<div style="padding: 40px; text-align: center;">Roulette Page</div>` };

            // 3. LOGIN PAGE (Matches your screenshot perfectly)
            const Login = {
                template: `
                    <div style="display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 80px); padding: 20px; background: #f0f2f5;">
                        <div style="background: white; width: 100%; max-width: 400px; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center;">
                            <h1 style="font-size: 28px; font-weight: 700; margin-bottom: 30px; color: #1a1a1a; font-family: 'Lexend Deca', sans-serif;">Login</h1>
                            <input type="text" placeholder="Username" style="width: 100%; padding: 14px 16px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 15px; font-family: 'Lexend Deca', sans-serif; margin-bottom: 16px; outline: none; background: #fafafa; box-sizing: border-box;">
                            <input type="password" placeholder="Password" style="width: 100%; padding: 14px 16px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 15px; font-family: 'Lexend Deca', sans-serif; margin-bottom: 16px; outline: none; background: #fafafa; box-sizing: border-box;">
                            <button style="width: 100%; padding: 14px; background: #2b6ef0; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; font-family: 'Lexend Deca', sans-serif; cursor: pointer; margin-top: 10px;">Login</button>
                            <a href="#/register" style="display: block; margin-top: 20px; font-size: 14px; color: #666; text-decoration: none; font-family: 'Lexend Deca', sans-serif;">Don't have an account? <span style="color: #2b6ef0; font-weight: 600;">Register</span></a>
                        </div>
                    </div>
                `
            };

            // 4. REGISTER PAGE (Matches Login design)
            const Register = {
                template: `
                    <div style="display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 80px); padding: 20px; background: #f0f2f5;">
                        <div style="background: white; width: 100%; max-width: 400px; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center;">
                            <h1 style="font-size: 28px; font-weight: 700; margin-bottom: 30px; color: #1a1a1a; font-family: 'Lexend Deca', sans-serif;">Register</h1>
                            <input type="text" placeholder="Username" style="width: 100%; padding: 14px 16px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 15px; font-family: 'Lexend Deca', sans-serif; margin-bottom: 16px; outline: none; background: #fafafa; box-sizing: border-box;">
                            <input type="email" placeholder="Email" style="width: 100%; padding: 14px 16px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 15px; font-family: 'Lexend Deca', sans-serif; margin-bottom: 16px; outline: none; background: #fafafa; box-sizing: border-box;">
                            <input type="password" placeholder="Password" style="width: 100%; padding: 14px 16px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 15px; font-family: 'Lexend Deca', sans-serif; margin-bottom: 16px; outline: none; background: #fafafa; box-sizing: border-box;">
                            <button style="width: 100%; padding: 14px; background: #2b6ef0; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; font-family: 'Lexend Deca', sans-serif; cursor: pointer; margin-top: 10px;">Register</button>
                            <a href="#/login" style="display: block; margin-top: 20px; font-size: 14px; color: #666; text-decoration: none; font-family: 'Lexend Deca', sans-serif;">Already have an account? <span style="color: #2b6ef0; font-weight: 600;">Login</span></a>
                        </div>
                    </div>
                `
            };

            // 5. Routes Setup
            const router = createRouter({
                history: createWebHistory(),
                routes: [
                    { path: '/', component: Home },
                    { path: '/leaderboard', component: Leaderboard },
                    { path: '/roulette', component: Roulette },
                    { path: '/login', component: Login },
                    { path: '/register', component: Register }
                ]
            });

            // 6. Mount the App
            const app = createApp({
                setup() {
                    return { store };
                }
            });

            app.use(router);
            app.mount('#app');
        </script>
    </body>
</html>
