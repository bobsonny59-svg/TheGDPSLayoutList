<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1024" />
        <title>the larp list</title>

        <!-- Replace your server icon by uploading an image file named "list_icon.png"-->
        <link rel="icon" href="/list_icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" type="text/css" href="/css/reset.css" />
        <link rel="stylesheet" type="text/css" href="/css/typography.css" />
        <link rel="stylesheet" type="text/css" href="/css/main.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/list.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="/css/pages/leaderboard.css"
        />
        <link rel="stylesheet" type="text/css" href="/css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/btn.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="/css/components/tabs.css"
        />
        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script type="module" src="/js/main.js"></script>
    </head>
    <body id="app">
        <header :class="{ dark: store.dark }">
            <!-- FIXED LOGO: Now 1 line -->
            <div class="logo" style="display: flex; align-items: center; gap: 12px;">
                <h2 style="margin: 0; font-size: 28px; font-weight: 700;">Larp List</h2>
                <p style="margin: 0; font-size: 14px; font-weight: 500; opacity: 0.8; padding-top: 2px;">v1.0.0</p>
            </div>
            
            <nav class="nav">
                <router-link class="nav__tab" to="/">
                    <span class="type-label-lg">List</span>
                </router-link>
                <router-link class="nav__tab" to="/leaderboard">
                    <span class="type-label-lg">Leaderboard</span>
                </router-link>
                <router-link class="nav__tab" to="/roulette">
                    <span class="type-label-lg">Roulette</span>
                </router-link>
                
                <div class="nav__actions" style="display: flex; align-items: center; gap: 12px;">
                    
                    <!-- Dark Mode Toggle Button -->
                    <button
                        class="nav__icon"
                        @click.prevent="store.toggleDark()"
                        style="display: flex; align-items: center; justify-content: center; background: transparent; border: none; cursor: pointer; padding: 4px;"
                    >
                        <img
                            :src="store.dark ? '/assets/light.svg' : '/assets/dark.svg'"
                            alt=""
                            style="width: 24px; height: 24px; display: block;"
                        />
                    </button>

                    <!-- Discord Icon -->
                    <a class="nav__icon" href="https://discord.gg/W9PhXXMSd" style="display: flex; align-items: center; justify-content: center; padding: 4px; text-decoration: none;">
                        <img src="/assets/discord.svg" alt="Discord Logo" style="width: 24px; height: 24px; display: block;" />
                    </a>

                    <!-- Separator line -->
                    <div style="width: 1px; height: 30px; background: rgba(255,255,255,0.3);"></div>

                    <!-- Login and Register buttons (FIXED: changed router-link to standard <a> tags) -->
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <a href="/login" style="
                            display: inline-flex;
                            align-items: center;
                            justify-content: center;
                            padding: 8px 18px;
                            background: white;
                            color: #2b6ef0;
                            border-radius: 50px;
                            text-decoration: none;
                            font-weight: 700;
                            font-size: 14px;
                            font-family: 'Lexend Deca', sans-serif;
                            height: 38px;
                            box-sizing: border-box;
                            transition: background 0.2s;
                        " onmouseover="this.style.background='#e6eefc'" onmouseout="this.style.background='white'">
                            Login
                        </a>
                        
                        <a href="/register" style="
                            display: inline-flex;
                            align-items: center;
                            justify-content: center;
                            padding: 8px 18px;
                            background: white;
                            color: #2b6ef0;
                            border-radius: 50px;
                            text-decoration: none;
                            font-weight: 700;
                            font-size: 14px;
                            font-family: 'Lexend Deca', sans-serif;
                            height: 38px;
                            box-sizing: border-box;
                            transition: background 0.2s;
                        " onmouseover="this.style.background='#e6eefc'" onmouseout="this.style.background='white'">
                            Register
                        </a>

                        <!-- Submit Record button -->
                        <a
                            href="https://forms.gle/irLaSCGuXMbEwD28A"
                            target="_blank"
                            style="
                                display: inline-flex;
                                align-items: center;
                                justify-content: center;
                                padding: 8px 20px;
                                background: white;
                                color: #2b6ef0;
                                border-radius: 50px;
                                text-decoration: none;
                                font-weight: 700;
                                font-size: 14px;
                                font-family: 'Lexend Deca', sans-serif;
                                height: 38px;
                                box-sizing: border-box;
                                transition: background 0.2s;
                            "
                            onmouseover="this.style.background='#e6eefc'" onmouseout="this.style.background='white'"
                            >Submit Record</a
                        >
                    </div>
                </div>
            </nav>
        </header>
        <router-view :class="{ dark: store.dark }"></router-view>
    </body>
</html>
