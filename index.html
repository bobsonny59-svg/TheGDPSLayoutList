<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1024" />
        <title>the larp list</title>

        <!-- Replace your server icon by uploading an image file named "list_icon.png"-->
        <link rel="icon" href="/list_icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" type="text/css" href="/css/reset.css" />
        <link rel="stylesheet" type="text/css" href="/css/typography.css" />
        <link rel="stylesheet" type="text/css" href="/css/main.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/list.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="/css/pages/leaderboard.css"
        />
        <link rel="stylesheet" type="text/css" href="/css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/btn.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="/css/components/tabs.css"
        />
        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script type="module" src="/js/main.js"></script>
        <style>
            /* Fix nav layout - exactly like your screenshot */
            .nav {
                display: flex;
                align-items: center;
                justify-content: space-between;
                width: 100%;
                gap: 1rem;
            }
            
            .nav__actions {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                margin-left: auto;
            }
            
            .nav__auth {
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }
            
            /* Style buttons exactly like .nav__cta */
            .nav__auth .btn-auth {
                display: inline-block;
                padding: 0.5rem 1.5rem;
                border-radius: 2rem;
                font-family: 'Lexend Deca', sans-serif;
                font-weight: 500;
                font-size: 0.9rem;
                line-height: 1.5;
                text-align: center;
                text-decoration: none;
                cursor: pointer;
                border: 1px solid transparent;
                transition: all 0.2s ease;
                letter-spacing: 0.3px;
                white-space: nowrap;
                background: #6c5ce7;
                color: #fff;
                border-color: #6c5ce7;
                box-shadow: 0 2px 6px rgba(108, 92, 231, 0.25);
            }
            
            .nav__auth .btn-auth:hover {
                background: #5a4bd1;
                border-color: #5a4bd1;
                box-shadow: 0 4px 10px rgba(108, 92, 231, 0.35);
                transform: translateY(-2px);
            }
            
            .nav__auth .btn-auth:active {
                transform: translateY(0px);
                box-shadow: 0 2px 4px rgba(108, 92, 231, 0.2);
            }
            
            /* Login button - outline style like your screenshot */
            .nav__auth .btn-login {
                background: transparent;
                color: #6c5ce7;
                border-color: #6c5ce7;
                box-shadow: none;
            }
            
            .nav__auth .btn-login:hover {
                background: #6c5ce7;
                color: #fff;
                box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
            }
            
            /* Dark mode overrides */
            header.dark .nav__auth .btn-auth {
                background: #8c7cf0;
                border-color: #8c7cf0;
                color: #1a1a2e;
            }
            
            header.dark .nav__auth .btn-auth:hover {
                background: #a394f5;
                border-color: #a394f5;
            }
            
            header.dark .nav__auth .btn-login {
                background: transparent;
                color: #a394f5;
                border-color: #a394f5;
                box-shadow: none;
            }
            
            header.dark .nav__auth .btn-login:hover {
                background: #a394f5;
                color: #1a1a2e;
                box-shadow: 0 4px 10px rgba(163, 148, 245, 0.3);
            }
            
            /* Keep nav tabs and actions in line */
            .nav__tab {
                white-space: nowrap;
            }
            
            .nav__cta {
                white-space: nowrap;
            }
            
            /* Fix the nav__icon spacing */
            .nav__icon {
                display: flex;
                align-items: center;
            }
            
            /* Make sure the nav items don't wrap */
            @media (max-width: 1024px) {
                .nav {
                    flex-wrap: nowrap;
                    overflow-x: auto;
                }
                .nav__actions {
                    flex-shrink: 0;
                }
            }
        </style>
    </head>
    <body id="app">
        <header :class="{ dark: store.dark }">
            <div class="logo">
                <h2>Larp List</h2>
                <p>v1.0.0</p>
            </div>
            <nav class="nav">
                <router-link class="nav__tab" to="/">
                    <span class="type-label-lg">List</span>
                </router-link>
                <router-link class="nav__tab" to="/leaderboard">
                    <span class="type-label-lg">Leaderboard</span>
                </router-link>
                <router-link class="nav__tab" to="/roulette">
                    <span class="type-label-lg">Roulette</span>
                </router-link>
                <div class="nav__actions">
                    <button
                        class="nav__icon"
                        @click.prevent="store.toggleDark()"
                    >
                        <img
                            :src="store.dark ? '/assets/light.svg' : '/assets/dark.svg'"
                            alt=""
                        />
                    </button>
                    <a class="nav__icon" href="https://discord.gg/W9PhXXMSd">
                        <img src="/assets/discord.svg" alt="Discord Logo" />
                    </a>
                    <a
                        class="nav__cta type-label-lg"
                        href="https://forms.gle/irLaSCGuXMbEwD28A"
                        target="_blank"
                        >Submit Record</a
                    >
                    <div class="nav__auth">
                        <button class="btn-auth btn-login" @click="handleLogin">Login</button>
                        <button class="btn-auth btn-signup" @click="handleSignUp">Register</button>
                    </div>
                </div>
            </nav>
        </header>
        <router-view :class="{ dark: store.dark }"></router-view>

        <script>
            (function() {
                Vue.mixin({
                    data() {
                        return {
                            authUsers: JSON.parse(localStorage.getItem('larpUsers')) || [],
                            currentUser: null
                        }
                    },
                    methods: {
                        handleSignUp() {
                            const username = prompt('Create a username (at least 3 characters):');
                            if (!username || username.trim().length < 3) {
                                alert('Username must be at least 3 characters.');
                                return;
                            }
                            const password = prompt('Create a password (at least 4 characters):');
                            if (!password || password.trim().length < 4) {
                                alert('Password must be at least 4 characters.');
                                return;
                            }
                            const existing = this.authUsers.find(u => u.username === username.trim());
                            if (existing) {
                                alert('Username already taken. Please choose another.');
                                return;
                            }
                            const newUser = { username: username.trim(), password: password.trim() };
                            this.authUsers.push(newUser);
                            localStorage.setItem('larpUsers', JSON.stringify(this.authUsers));
                            this.currentUser = newUser;
                            alert(`Account created successfully! Welcome, ${newUser.username}!`);
                        },
                        handleLogin() {
                            const username = prompt('Enter your username:');
                            if (!username || username.trim() === '') {
                                alert('Username is required.');
                                return;
                            }
                            const password = prompt('Enter your password:');
                            if (!password || password.trim() === '') {
                                alert('Password is required.');
                                return;
                            }
                            const found = this.authUsers.find(u => u.username === username.trim() && u.password === password.trim());
                            if (found) {
                                this.currentUser = found;
                                alert(`Welcome back, ${found.username}! You are now logged in.`);
                            } else {
                                alert('Invalid username or password. Please try again or register.');
                            }
                        }
                    }
                });
            })();
        </script>
    </body>
</html>
