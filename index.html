<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1024" />
        <title>the larp list</title>

        <link rel="icon" href="/list_icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" type="text/css" href="/css/reset.css" />
        <link rel="stylesheet" type="text/css" href="/css/typography.css" />
        <link rel="stylesheet" type="text/css" href="/css/main.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/list.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/leaderboard.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/btn.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/tabs.css" />
        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script type="module" src="/js/main.js"></script>
    </head>
    <body id="app">
        <!-- Added style="flex-wrap: nowrap;" to keep everything on one row -->
        <header :class="{ dark: store.dark }" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; flex-wrap: nowrap; overflow-x: auto;">
            
            <!-- FIXED: Logo is now one single line -->
            <div class="logo" style="display: flex; align-items: center; gap: 10px; white-space: nowrap;">
                <h2 style="margin: 0; font-size: 24px; font-weight: 700;">Larp List</h2>
                <p style="margin: 0; font-size: 12px; opacity: 0.8;">v1.0.0</p>
            </div>
            
            <nav class="nav" style="display: flex; align-items: center; gap: 15px; flex-shrink: 0;">
                <router-link class="nav__tab" to="/">
                    <span class="type-label-lg">List</span>
                </router-link>
                <router-link class="nav__tab" to="/leaderboard">
                    <span class="type-label-lg">Leaderboard</span>
                </router-link>
                <router-link class="nav__tab" to="/roulette">
                    <span class="type-label-lg">Roulette</span>
                </router-link>
                
                <!-- Tightened the gap between icons and buttons so they all fit -->
                <div class="nav__actions" style="display: flex; align-items: center; gap: 6px; flex-shrink: 0;">
                    
                    <!-- 1. Moon Icon -->
                    <button class="nav__icon" @click.prevent="store.toggleDark()" style="background: transparent; border: none; cursor: pointer; padding: 4px;">
                        <img :src="store.dark ? '/assets/light.svg' : '/assets/dark.svg'" alt="" style="width: 22px; height: 22px; display: block;" />
                    </button>

                    <!-- 2. Discord Icon -->
                    <a class="nav__icon" href="https://discord.gg/W9PhXXMSd" style="display: flex; align-items: center; padding: 4px;">
                        <img src="/assets/discord.svg" alt="Discord Logo" style="width: 22px; height: 22px; display: block;" />
                    </a>

                    <!-- 3. Submit Record -->
                    <a class="nav__cta type-label-lg" href="https://forms.gle/irLaSCGuXMbEwD28A" target="_blank">Submit Record</a>

                    <!-- 4. Login / Profile / Logout -->
                    <template v-if="!store.user">
                        <router-link class="nav__cta type-label-lg" to="/login">Login</router-link>
                        <router-link class="nav__cta type-label-lg" to="/register">Register</router-link>
                    </template>
                    <template v-else>
                        <router-link class="nav__cta type-label-lg" to="/profile">Profile</router-link>
                        <a @click.prevent="store.logout()" href="#" class="nav__cta type-label-lg" style="cursor: pointer;">Logout</a>
                    </template>
                    
                </div>
            </nav>
        </header>
        <router-view :class="{ dark: store.dark }"></router-view>
    </body>
</html>
