<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1024" />
        <title>the larp list</title>

        <!-- Replace your server icon by uploading an image file named "list_icon.png"-->
        <link rel="icon" href="/list_icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" type="text/css" href="/css/reset.css" />
        <link rel="stylesheet" type="text/css" href="/css/typography.css" />
        <link rel="stylesheet" type="text/css" href="/css/main.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/list.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="/css/pages/leaderboard.css"
        />
        <link rel="stylesheet" type="text/css" href="/css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/btn.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="/css/components/tabs.css"
        />
        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script type="module" src="/js/main.js"></script>
        <style>
            /* make auth buttons look exactly like .nav__cta */
            .nav__auth {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                margin-left: 0.5rem;
            }
            .nav__auth .btn-auth {
                display: inline-block;
                padding: 0.45rem 1.2rem;
                border-radius: 2rem;
                font-family: 'Lexend Deca', sans-serif;
                font-weight: 500;
                font-size: 0.9rem;
                line-height: 1.5;
                text-align: center;
                text-decoration: none;
                cursor: pointer;
                border: 1px solid transparent;
                transition: background 0.2s, color 0.2s, border-color 0.2s, box-shadow 0.2s;
                background: var(--nav-cta-bg, #6c5ce7);
                color: var(--nav-cta-color, #fff);
                border-color: var(--nav-cta-border, #6c5ce7);
                letter-spacing: 0.3px;
                box-shadow: 0 2px 6px rgba(108, 92, 231, 0.25);
                background: #6c5ce7;
                color: #fff;
                border-color: #6c5ce7;
            }
            .nav__auth .btn-auth:hover {
                background: #5a4bd1;
                border-color: #5a4bd1;
                box-shadow: 0 4px 10px rgba(108, 92, 231, 0.35);
                transform: translateY(-1px);
            }
            .nav__auth .btn-auth:active {
                transform: translateY(0px);
                box-shadow: 0 2px 4px rgba(108, 92, 231, 0.2);
            }
            /* login variant: subtle outline to distinguish, but still matching cta style */
            .nav__auth .btn-login {
                background: transparent;
                color: #6c5ce7;
                border-color: #6c5ce7;
                box-shadow: none;
            }
            .nav__auth .btn-login:hover {
                background: #6c5ce7;
                color: #fff;
                box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
            }
            /* dark mode overrides to keep consistency with .nav__cta */
            header.dark .nav__auth .btn-auth {
                background: #8c7cf0;
                border-color: #8c7cf0;
                color: #1a1a2e;
            }
            header.dark .nav__auth .btn-auth:hover {
                background: #a394f5;
                border-color: #a394f5;
            }
            header.dark .nav__auth .btn-login {
                background: transparent;
                color: #a394f5;
                border-color: #a394f5;
                box-shadow: none;
            }
            header.dark .nav__auth .btn-login:hover {
                background: #a394f5;
                color: #1a1a2e;
                box-shadow: 0 4px 10px rgba(163, 148, 245, 0.3);
            }
            /* make sure nav__actions flex-wrap nicely if needed */
            .nav__actions {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                flex-wrap: wrap;
            }
        </style>
    </head>
    <body id="app">
        <header :class="{ dark: store.dark }">
            <div class="logo">
                <h2>Larp List</h2>
                <p>v1.0.0</p>
            </div>
            <nav class="nav">
                <router-link class="nav__tab" to="/">
                    <span class="type-label-lg">List</span>
                </router-link>
                <router-link class="nav__tab" to="/leaderboard">
                    <span class="type-label-lg">Leaderboard</span>
                </router-link>
                <router-link class="nav__tab" to="/roulette">
                    <span class="type-label-lg">Roulette</span>
                </router-link>
                <div class="nav__actions">
                    <button
                        class="nav__icon"
                        @click.prevent="store.toggleDark()"
                    >
                        <img
                            :src="store.dark ? '/assets/light.svg' : '/assets/dark.svg'"
                            alt=""
                        />
                    </button>
                    <!-- Replace the '#' with your discord server's invite-->
                    <a class="nav__icon" href="https://discord.gg/W9PhXXMSd">
                        <img src="/assets/discord.svg" alt="Discord Logo" />
                    </a>
                    <!-- List record submission form -->
                    <a
                        class="nav__cta type-label-lg"
                        href="https://forms.gle/irLaSCGuXMbEwD28A"
                        target="_blank"
                        >Submit Record</a
                    >
                    <!-- TWO NEW BUTTONS: Sign Up & Log In, styled like .nav__cta -->
                    <div class="nav__auth">
                        <button class="btn-auth btn-signup" @click="handleSignUp">Sign Up</button>
                        <button class="btn-auth btn-login" @click="handleLogin">Log In</button>
                    </div>
                </div>
            </nav>
        </header>
        <router-view :class="{ dark: store.dark }"></router-view>

        <!-- Vue app extensions for signup/login logic with account creation simulation -->
        <script>
            (function() {
                // Use a global mixin to add methods to the existing root component (from main.js)
                // This ensures the buttons work and we can simulate account creation.
                Vue.mixin({
                    data() {
                        return {
                            // We'll store a simple "registered" flag to simulate accounts
                            authUsers: JSON.parse(localStorage.getItem('larpUsers')) || [],
                            currentUser: null
                        }
                    },
                    methods: {
                        handleSignUp() {
                            // Simulate account creation: prompt for username/password
                            const username = prompt('Create a username (at least 3 characters):');
                            if (!username || username.trim().length < 3) {
                                alert('Username must be at least 3 characters.');
                                return;
                            }
                            const password = prompt('Create a password (at least 4 characters):');
                            if (!password || password.trim().length < 4) {
                                alert('Password must be at least 4 characters.');
                                return;
                            }
                            // Check if username already exists
                            const existing = this.authUsers.find(u => u.username === username.trim());
                            if (existing) {
                                alert('Username already taken. Please choose another.');
                                return;
                            }
                            // Save new user
                            const newUser = { username: username.trim(), password: password.trim() };
                            this.authUsers.push(newUser);
                            localStorage.setItem('larpUsers', JSON.stringify(this.authUsers));
                            this.currentUser = newUser;
                            alert(`Account created successfully! Welcome, ${newUser.username}. You are now logged in.`);
                            // Optionally update UI: we could emit an event or just show a message.
                            // For demo we just update the state.
                        },
                        handleLogin() {
                            // Simulate login: prompt for credentials
                            const username = prompt('Enter your username:');
                            if (!username || username.trim() === '') {
                                alert('Username is required.');
                                return;
                            }
                            const password = prompt('Enter your password:');
                            if (!password || password.trim() === '') {
                                alert('Password is required.');
                                return;
                            }
                            const found = this.authUsers.find(u => u.username === username.trim() && u.password === password.trim());
                            if (found) {
                                this.currentUser = found;
                                alert(`Welcome back, ${found.username}! You are now logged in.`);
                            } else {
                                alert('Invalid username or password. Please try again or sign up.');
                            }
                        }
                    }
                });
                console.log('Sign Up & Log In buttons with account simulation ready.');
            })();
        </script>
    </body>
</html>
