<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1024" />
        <title>the larp list</title>

        <link rel="icon" href="/list_icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" type="text/css" href="/css/reset.css" />
        <link rel="stylesheet" type="text/css" href="/css/typography.css" />
        <link rel="stylesheet" type="text/css" href="/css/main.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/list.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/leaderboard.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/btn.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/tabs.css" />
        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script type="module" src="/js/main.js"></script>
    </head>
    <body id="app">
        <header :class="{ dark: store.dark }">
            <div class="logo">
                <h2>Larp List</h2>
                <p>v1.0.0</p>
            </div>
            <nav class="nav">
                <router-link class="nav__tab" to="/">
                    <span class="type-label-lg">List</span>
                </router-link>
                <router-link class="nav__tab" to="/leaderboard">
                    <span class="type-label-lg">Leaderboard</span>
                </router-link>
                <router-link class="nav__tab" to="/roulette">
                    <span class="type-label-lg">Roulette</span>
                </router-link>
                <div class="nav__actions" style="display: flex; align-items: center;">
                    
                    <!-- 1. DISCORD ICON (No changes) -->
                    <a class="nav__icon" href="https://discord.gg/W9PhXXMSd">
                        <img src="/assets/discord.svg" alt="Discord Logo" />
                    </a>

                    <!-- 2. LIGHT/DARK MODE TOGGLE (Moved next to Discord) -->
                    <button class="nav__icon" @click.prevent="store.toggleDark()" style="margin-right: 8px;">
                        <img :src="store.dark ? '/assets/light.svg' : '/assets/dark.svg'" alt="" />
                    </button>

                    <!-- 3. SUBMIT RECORD -->
                    <a class="nav__cta type-label-lg" href="https://forms.gle/irLaSCGuXMbEwD28A" target="_blank">Submit Record</a>

                    <!-- ========================================== -->
                    <!-- 4. LOGIN / PROFILE / LOGOUT BUTTONS       -->
                    <!-- ========================================== -->
                    <template v-if="!store.user">
                        <!-- When logged out, show Login & Register -->
                        <router-link class="nav__cta type-label-lg" to="/login" style="margin-left: 8px;">Login</router-link>
                        <router-link class="nav__cta type-label-lg" to="/register" style="margin-left: 8px;">Register</router-link>
                    </template>
                    <template v-else>
                        <!-- When logged in, show Profile & Logout -->
                        <router-link class="nav__cta type-label-lg" to="/profile" style="margin-left: 8px;">Profile</router-link>
                        <a @click.prevent="store.logout()" href="#" class="nav__cta type-label-lg" style="margin-left: 8px; cursor: pointer;">Logout</a>
                    </template>
                    
                </div>
            </nav>
        </header>
        <router-view :class="{ dark: store.dark }"></router-view>
    </body>
</html>
